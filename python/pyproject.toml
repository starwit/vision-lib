[tool.poetry]
name = "visionlib"
version = "2.0.0"
description = ""
authors = ["flonix8 <flstanek@googlemail.com>"]
license = "AGPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
valkey = ">=6.0.0"
pybase64 = ">=1.3.0"
pydantic = ">=2.3.0"
pyyaml = ">=6.0.1"
pydantic-settings = ">=2.0.3"
pyturbojpeg = { version = ">=1.8.3,<2.0.0", optional = true }
numpy = { version = ">=1.24.0", optional = true }
prometheus-client = ">=0.19.0"

[tool.poetry.extras]
frames = ["numpy", "pyturbojpeg"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.1"
testcontainers = {extras = ["core"], version = "4.13.3"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
